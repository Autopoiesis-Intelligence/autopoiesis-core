name: CI
run-name: "${{ github.event_name == 'workflow_dispatch' && inputs.restore_fault != '' && inputs.restore_fault != 'none' && format('Negative restore fault: {0}', inputs.restore_fault) || 'CI' }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/ci-restore-task-queue-artifact, integration/queue-restore-history-validation, claude/cl-020-a10-cycle, claude/cl-021-scheduled-cycle, feat/queue-lifecycle-migration-20261025]
  workflow_dispatch:
    inputs:
      restore_run_id:
        description: "Run ID (digits only) of the latest successful snapshot run on this branch, or 'latest' to select it automatically. Leave blank for the seed run."
        required: false
        type: string
        default: ""
      seed_done_probe:
        description: "Seed a synthetic DONE queue item into this run's artifact for cross-run restore verification"
        required: false
        type: boolean
        default: false
      restore_fault:
        description: "Negative restore test: tamper with the downloaded archive or snapshot. The run must fail at the expected integrity/schema gate."
        required: false
        type: choice
        default: none
        options:
          - none
          - tamper_archive
          - tamper_bytes
          - corrupt_json
          - bad_version
          - bad_history
          - drop_queue
          - drop_manifest

permissions:
  actions: read
  contents: read

# Dispatch runs on one branch run one at a time, so a restore always starts after
# the previous snapshot run has finished and selects it. Other events are not grouped.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('queue-snapshot-{0}', github.ref) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject conflicting seed and restore modes
        if: ${{ inputs.seed_done_probe && inputs.restore_run_id != '' }}
        run: |
          echo "seed_done_probe and restore_run_id are mutually exclusive: seed a source run first, then restore from its numeric run ID in a separate run." >&2
          exit 1
      - name: Reject a restore fault without a restore
        if: ${{ inputs.restore_fault != '' && inputs.restore_fault != 'none' && inputs.restore_run_id == '' }}
        run: |
          echo "restore_fault needs restore_run_id: it corrupts a downloaded snapshot, so there must be one to download." >&2
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify prior run succeeded
        id: source
        if: ${{ inputs.restore_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORE_RUN_ID: ${{ inputs.restore_run_id }}
        run: |
          if [[ "$RESTORE_RUN_ID" == "latest" ]]; then
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=workflow_dispatch&branch=${GITHUB_REF_NAME}&per_page=100" > .restore-candidates-pages.json
            RESTORE_RUN_ID=$(python - <<'PY'
          import json
          import os
          from pathlib import Path
          from autopoesis.queue_snapshot import latest_source_run_id

          pages = json.loads(
              Path(".restore-candidates-pages.json").read_text(encoding="utf-8")
          )
          if not isinstance(pages, list) or any(
              not isinstance(page, dict)
              or not isinstance(page.get("workflow_runs"), list)
              for page in pages
          ):
              raise SystemExit(
                  "Refusing: paginated workflow run history is malformed or incomplete"
              )
          payload = {
              "workflow_runs": [
                  run for page in pages for run in page["workflow_runs"]
              ]
          }
          print(
              latest_source_run_id(
                  payload,
                  current_run_id=os.environ["GITHUB_RUN_ID"],
                  current_branch=os.environ["GITHUB_REF_NAME"],
              )
          )
          PY
            )
            echo "Selected latest snapshot run ${RESTORE_RUN_ID} on branch ${GITHUB_REF_NAME}."
          elif [[ ! "$RESTORE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Invalid restore_run_id: enter the numeric ID of the latest successful snapshot run (digits only) or 'latest', not the field name or a URL. Leave blank when creating the seed run." >&2
            exit 1
          fi
          export RESTORE_RUN_ID
          echo "run_id=${RESTORE_RUN_ID}" >> "$GITHUB_OUTPUT"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RESTORE_RUN_ID}" > .restore-run.json
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          from autopoesis.queue_snapshot import (
              bind_source_artifact,
              require_latest_source_run,
              validate_restore_source_run,
          )

          requested_run_id = os.environ["RESTORE_RUN_ID"]
          run = json.loads(Path(".restore-run.json").read_text(encoding="utf-8"))
          provenance = validate_restore_source_run(
              run,
              requested_run_id=requested_run_id,
              expected_repository=os.environ["GITHUB_REPOSITORY"],
          )
          artifacts_response = subprocess.run(
              [
                  "gh", "api",
                  f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{requested_run_id}/artifacts",
              ],
              check=True, capture_output=True, text=True,
          )
          artifacts_payload = json.loads(artifacts_response.stdout)
          provenance = bind_source_artifact(
              provenance,
              artifacts_payload,
              requested_run_id=requested_run_id,
          )
          runs_response = subprocess.run(
              [
                  "gh", "api",
                  "--paginate",
                  "--slurp",
                  f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/ci.yml/runs"
                  f"?event=workflow_dispatch&branch={os.environ['GITHUB_REF_NAME']}&per_page=100",
              ],
              check=True, capture_output=True, text=True,
          )
          run_pages = json.loads(runs_response.stdout)
          if not isinstance(run_pages, list) or any(
              not isinstance(page, dict) or not isinstance(page.get("workflow_runs"), list)
              for page in run_pages
          ):
              raise SystemExit("Refusing: workflow run history is malformed or incomplete")
          run_history = {"workflow_runs": [
              item for page in run_pages for item in page["workflow_runs"]
          ]}
          provenance = require_latest_source_run(
              provenance,
              run_history,
              current_run_id=os.environ["GITHUB_RUN_ID"],
              current_branch=os.environ["GITHUB_REF_NAME"],
          )
          Path("QUEUE_RESTORE_PROVENANCE.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(
              f"Verified source run {provenance['source_run_id']} "
              f"at SHA {provenance['source_head_sha']}; "
              f"artifact {provenance['source_artifact_id']} "
              f"with archive digest {provenance['source_artifact_digest']}."
          )
          PY
      - name: Download and verify prior queue snapshot archive
        id: archive_verification
        if: ${{ inputs.restore_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORE_FAULT: ${{ inputs.restore_fault }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          from autopoesis.queue_snapshot import verify_and_extract_artifact_archive

          provenance = json.loads(
              Path("QUEUE_RESTORE_PROVENANCE.json").read_text(encoding="utf-8")
          )
          artifact_id = provenance.get("source_artifact_id")
          if type(artifact_id) is not int or artifact_id <= 0:
              raise SystemExit("Refusing: source artifact ID is invalid")

          archive = Path(".queue-restore-artifact.zip")
          try:
              with archive.open("wb") as archive_output:
                  subprocess.run(
                      [
                          "gh", "api",
                          f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{artifact_id}/zip",
                      ],
                      stdout=archive_output,
                      check=True,
                  )
              if os.environ.get("RESTORE_FAULT") == "tamper_archive":
                  with archive.open("ab") as damaged:
                      damaged.write(b"tampered")
                  print("Injected archive-byte tampering before digest verification.")
              try:
                  result = verify_and_extract_artifact_archive(
                      archive,
                      Path(".queue-restore"),
                      expected_digest=provenance.get("source_artifact_digest"),
                  )
              except ValueError as exc:
                  expected_message = (
                      "Downloaded artifact archive SHA-256 does not match source metadata"
                  )
                  if (
                      os.environ.get("RESTORE_FAULT") == "tamper_archive"
                      and str(exc) == expected_message
                  ):
                      output_path = os.environ.get("GITHUB_OUTPUT")
                      if not output_path:
                          raise SystemExit(
                              "Expected archive digest mismatch, but GITHUB_OUTPUT is unavailable"
                          ) from exc
                      with open(output_path, "a", encoding="utf-8") as output:
                          output.write("expected_gate=archive_digest_mismatch\n")
                      print(
                          "EXPECTED_NEGATIVE_GATE=archive_digest_mismatch: "
                          "tampered archive rejected by source SHA-256 check."
                      )
                      raise SystemExit(
                          "Expected negative test: archive digest mismatch was confirmed"
                      ) from exc
                  raise
              print(
                  "Downloaded artifact archive verified before extraction: "
                  f"{result['archive_sha256']}; "
                  f"{result['extracted_file_count']} archive entries."
              )
          finally:
              archive.unlink(missing_ok=True)
          PY
      - name: Inject restore fault for negative verification
        if: ${{ inputs.restore_run_id != '' && inputs.restore_fault != '' && inputs.restore_fault != 'none' }}
        env:
          RESTORE_FAULT: ${{ inputs.restore_fault }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          fault = os.environ["RESTORE_FAULT"]
          snapshot = Path(".queue-restore/TASK_QUEUE.json")
          manifest_path = Path(".queue-restore/QUEUE_SNAPSHOT_MANIFEST.json")

          def rebind(data):
              # Keep the manifest consistent so the queue loader, not the hash check, must reject it.
              snapshot.write_bytes(data)
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              manifest["task_queue_sha256"] = hashlib.sha256(data).hexdigest()
              manifest["task_queue_size_bytes"] = len(data)
              manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          if fault == "tamper_bytes":
              snapshot.write_bytes(snapshot.read_bytes() + b" ")
          elif fault == "corrupt_json":
              rebind(b'{"version": 1, "items": [')
          elif fault == "bad_version":
              queue = json.loads(snapshot.read_text(encoding="utf-8"))
              queue["version"] = 2
              rebind(json.dumps(queue).encode("utf-8"))
          elif fault == "bad_history":
              queue = json.loads(snapshot.read_text(encoding="utf-8"))
              queue["history"].append({"event": "UNKNOWN_EVENT", "task_id": "CI-RESTORE-DONE-PROBE"})
              rebind(json.dumps(queue).encode("utf-8"))
          elif fault == "drop_queue":
              snapshot.unlink()
          elif fault == "drop_manifest":
              manifest_path.unlink()
          else:
              raise SystemExit(f"Unknown restore_fault {fault!r}")
          print(f"Injected restore fault {fault!r} into the downloaded snapshot.")
          PY
      - name: Validate and install prior queue snapshot
        id: restore_validation
        if: ${{ inputs.restore_run_id != '' }}
        env:
          RESTORE_FAULT: ${{ inputs.restore_fault }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from autopoesis.queue_snapshot import install_validated_queue_snapshot, validate_queue_snapshot
          from autopoesis.task_queue import load_queue

          snapshot = Path(".queue-restore/TASK_QUEUE.json")
          manifest_path = Path(".queue-restore/QUEUE_SNAPSHOT_MANIFEST.json")
          provenance_path = Path("QUEUE_RESTORE_PROVENANCE.json")
          provenance = json.loads(provenance_path.read_text(encoding="utf-8"))
          fault = os.environ.get("RESTORE_FAULT", "")

          expected = {
              "tamper_bytes": (
                  "task_queue_sha256_mismatch",
                  lambda message: message == "TASK_QUEUE.json SHA-256 does not match source snapshot manifest",
              ),
              "corrupt_json": (
                  "queue_json_decode_error",
                  lambda message: message.startswith("Cannot read task queue:") and bool(message.partition(":")[2].strip()),
              ),
              "bad_version": (
                  "unsupported_queue_version",
                  lambda message: message == "Unsupported task queue format",
              ),
              "bad_history": (
                  "invalid_queue_history_event",
                  lambda message: (
                      message.startswith("Invalid task queue history entry at index")
                      and "unsupported event type 'UNKNOWN_EVENT'" in message
                  ),
              ),
              "drop_queue": (
                  "missing_queue_snapshot",
                  lambda message: message == "Queue snapshot file is missing",
              ),
              "drop_manifest": (
                  "missing_queue_manifest",
                  lambda message: message == "Queue snapshot manifest file is missing",
              ),
          }

          try:
              validation = validate_queue_snapshot(
                  snapshot,
                  manifest_path,
                  source_run_id=provenance.get("source_run_id"),
                  source_head_sha=provenance.get("source_head_sha"),
                  source_repository=provenance.get("source_repository"),
              )
          except Exception as exc:
              message = str(exc)
              expected_case = expected.get(fault)
              if expected_case is not None and expected_case[1](message):
                  label = expected_case[0]
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      output.write(f"expected_gate={label}\n")
                  print(f"EXPECTED_NEGATIVE_GATE={label}: {message}")
                  raise SystemExit(f"Expected negative restore gate confirmed: {label}") from exc
              raise

          if fault in expected:
              raise SystemExit(
                  f"Restore fault {fault!r} was not rejected at its expected validation gate"
              )

          restored = Path("TASK_QUEUE.json")
          install_validated_queue_snapshot(
              snapshot,
              restored,
              expected_queue=validation["queue"],
              expected_sha256=validation["task_queue_sha256"],
              expected_size_bytes=validation["task_queue_size_bytes"],
          )
          restored_queue = load_queue(restored)
          if restored_queue != validation["queue"]:
              raise SystemExit("Installed queue does not match the validated source snapshot")
          provenance["source_manifest_sha256"] = validation["source_manifest_sha256"]
          provenance["source_manifest_task_queue_sha256"] = validation["task_queue_sha256"]
          provenance["restored_queue_sha256"] = validation["task_queue_sha256"]
          provenance["restored_queue_size_bytes"] = restored.stat().st_size
          provenance_path.write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(
              "Prior task queue snapshot restored and validated; "
              f"queue SHA-256 {provenance['restored_queue_sha256']}."
          )
          PY
      - name: Assert injected restore fault failed at its expected validation gate
        if: ${{ always() && inputs.restore_run_id != '' && inputs.restore_fault != '' && inputs.restore_fault != 'none' && inputs.restore_fault != 'tamper_archive' }}
        env:
          RESTORE_FAULT: ${{ inputs.restore_fault }}
          EXPECTED_GATE: ${{ steps.restore_validation.outputs.expected_gate }}
        run: |
          case "$RESTORE_FAULT:$EXPECTED_GATE" in
            tamper_bytes:task_queue_sha256_mismatch|corrupt_json:queue_json_decode_error|bad_version:unsupported_queue_version|bad_history:invalid_queue_history_event|drop_queue:missing_queue_snapshot|drop_manifest:missing_queue_manifest)
              echo "Confirmed expected restore rejection: $RESTORE_FAULT -> $EXPECTED_GATE"
              ;;
            *)
              echo "Restore fault did not prove its intended validation gate: fault='$RESTORE_FAULT' gate='$EXPECTED_GATE'." >&2
              exit 1
              ;;
          esac
      - name: Assert tamper_archive failed at the expected digest gate
        if: ${{ always() && inputs.restore_run_id != '' && inputs.restore_fault == 'tamper_archive' }}
        env:
          EXPECTED_GATE: ${{ steps.archive_verification.outputs.expected_gate }}
        run: |
          if [[ "$EXPECTED_GATE" != "archive_digest_mismatch" ]]; then
            echo "tamper_archive did not prove rejection at the archive digest gate; got '$EXPECTED_GATE'." >&2
            exit 1
          fi
          echo "Confirmed tamper_archive rejection at the archive digest gate."
      - name: Validate workflow YAML syntax
        run: |
          ruby -e 'require "yaml"; files = Dir.glob(".github/workflows/*.{yml,yaml}").sort; abort "No workflow files found" if files.empty?; files.each { |f| YAML.load_file(f, aliases: true); puts "Parsed #{f}" }'
      - name: Check shell syntax and embedded Python in workflow run steps
        run: |
          ruby <<'RUBY'
          require "yaml"
          require "tempfile"
          require "open3"

          files = Dir.glob(".github/workflows/*.{yml,yaml}").sort
          bad = 0
          python_blocks = 0
          files.each do |file|
            workflow = YAML.load_file(file, aliases: true)
            (workflow["jobs"] || {}).each do |job_name, job|
              (job["steps"] || []).each do |step|
                next unless step["run"]
                Tempfile.create(["workflow-step-", ".sh"]) do |shell|
                  shell.write(step["run"])
                  shell.flush
                  stdout, stderr, status = Open3.capture3("bash", "-n", shell.path)
                  unless status.success? && stdout.empty? && stderr.empty?
                    warn(stdout + stderr)
                    warn("Shell syntax error: #{file} job #{job_name} step #{step["name"].inspect}")
                    bad += 1
                  end
                end
                step["run"].scan(/(?:\A|\n)[ \t]*(?:[A-Za-z_][A-Za-z0-9_]*=\$\()?python[ \t]+-[ \t]+<<['"]?PY['"]?[ \t]*\n(.*?)^[ \t]*PY[ \t]*$/m) do |match|
                  python_blocks += 1
                  Tempfile.create(["workflow-python-", ".py"]) do |python|
                    python.write(match[0])
                    python.flush
                    stdout, stderr, status = Open3.capture3("python", "-m", "py_compile", python.path)
                    unless status.success?
                      warn(stdout + stderr)
                      warn("Embedded Python syntax error: #{file} job #{job_name} step #{step["name"].inspect}")
                      bad += 1
                    end
                  end
                end
              end
            end
          end
          abort "Expected 8 embedded Python heredocs, found #{python_blocks}" unless python_blocks == 8
          abort "#{bad} workflow run step(s) failed syntax checks" if bad > 0
          puts "All workflow shell steps and #{python_blocks} embedded Python heredocs pass syntax checks."
          RUBY
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run file-based tasks
        run: python run_tasks.py
      - name: Seed synthetic DONE probe for cross-run verification
        if: ${{ inputs.seed_done_probe }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from autopoesis.executor import source_tree_digest
          from autopoesis.task_queue import (
              advance_task_file,
              current_attempt,
              update_queue_file,
              record_verification_file,
          )

          queue_path = Path("TASK_QUEUE.json")
          probe = {
              "id": "CI-RESTORE-DONE-PROBE",
              "type": "test_probe",
              "source": ".github/workflows/ci.yml",
              "evidence": "explicit workflow_dispatch seed for cross-run snapshot verification",
              "description": "Synthetic verification item; not a production task.",
          }
          update_queue_file(queue_path, [probe])
          note = "synthetic CI fixture for cross-run restore verification"
          revision = source_tree_digest(Path("autopoesis"))
          # Walk the governed lifecycle: DONE is accepted only after a PASS since IN_PROGRESS.
          token = advance_task_file(queue_path, probe["id"], "SELECTED", note, owner="ci-seed-probe")["lease"]["token"]
          advance_task_file(queue_path, probe["id"], "IN_PROGRESS", note, token=token)
          record_verification_file(
              queue_path, probe["id"], "PASS", "CI_SYNTHETIC_PERSISTENCE_PROBE",
              source=probe["source"], attempt=current_attempt(queue_path, probe["id"]), revision=revision,
              token=token,
          )
          advance_task_file(queue_path, probe["id"], "DONE", note, token=token, revision=revision)
          record_verification_file(
              queue_path,
              "CI-RESTORE-VERIFICATION-PROBE",
              "PASS",
              "CI_SYNTHETIC_PERSISTENCE_PROBE",
              "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
          )
          print("Seeded synthetic DONE and verification-evidence probes into the artifact queue.")
          PY
      - name: Verify restored DONE probe when present
        if: ${{ inputs.restore_run_id != '' }}
        env:
          REQUIRE_RESTORE_PROBES: "true"
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from autopoesis.task_queue import load_queue

          queue = load_queue(Path("TASK_QUEUE.json"))
          probe = next(
              (item for item in queue["items"] if item.get("id") == "CI-RESTORE-DONE-PROBE"),
              None,
          )
          if probe is None:
              if os.environ.get("REQUIRE_RESTORE_PROBES", "false").lower() == "true":
                  raise SystemExit("Required synthetic DONE probe is missing from restored snapshot")
              print("No synthetic DONE probe in source snapshot; cross-run DONE check not exercised.")
          else:
              if probe.get("status") != "DONE":
                  raise SystemExit(
                      f"Restored DONE probe has unexpected status: {probe.get('status')!r}"
                  )
              matching_history = [
                  event for event in queue["history"]
                  if event.get("task_id") == "CI-RESTORE-DONE-PROBE"
                  and event.get("to") == "DONE"
              ]
              if not matching_history:
                  raise SystemExit("Restored DONE probe has no DONE transition in history")
              probe_items = [item for item in queue["items"] if item.get("id") == "CI-RESTORE-DONE-PROBE"]
              if len(probe_items) != 1 or len(matching_history) != 1:
                  raise SystemExit(
                      "Restored DONE probe was duplicated: "
                      f"{len(probe_items)} items, {len(matching_history)} DONE transitions"
                  )
              print("Synthetic DONE probe and its status history survived cross-run restore.")

          verification = next(
              (
                  event for event in queue["history"]
                  if event.get("event") == "VERIFICATION_RECORDED"
                  and event.get("task_id") == "CI-RESTORE-VERIFICATION-PROBE"
              ),
              None,
          )
          if verification is not None:
              expected = {
                  "verification_status": "PASS",
                  "verification_level": "CI_SYNTHETIC_PERSISTENCE_PROBE",
                  "artifact_sha256": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
              }
              for key, value in expected.items():
                  if verification.get(key) != value:
                      raise SystemExit(
                          f"Restored verification evidence field {key!r} mismatch"
                      )
              print("Synthetic verification evidence and digest survived cross-run restore.")
          else:
              if os.environ.get("REQUIRE_RESTORE_PROBES", "false").lower() == "true":
                  raise SystemExit("Required synthetic verification evidence is missing from restored snapshot")
              print("No synthetic verification evidence in source snapshot; evidence restore check not exercised.")
          PY
      - name: Create queue snapshot manifest
        if: always() && hashFiles('TASK_QUEUE.json') != ''
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from autopoesis.queue_snapshot import create_queue_snapshot_manifest

          manifest = create_queue_snapshot_manifest(
              Path("TASK_QUEUE.json"),
              source_run_id=os.environ["SOURCE_RUN_ID"],
              source_head_sha=os.environ["SOURCE_HEAD_SHA"],
              source_repository=os.environ["SOURCE_REPOSITORY"],
          )
          Path("QUEUE_SNAPSHOT_MANIFEST.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("Created queue snapshot manifest for this run.")
          PY
      - name: Upload task results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopoesis-core-results
          path: |
            RESULTS.json
            TASK_QUEUE.json
            QUEUE_RESTORE_PROVENANCE.json
            QUEUE_SNAPSHOT_MANIFEST.json
          if-no-files-found: warn
