name: E4 bounded-output runtime probe

on:
  pull_request:
    paths:
      - '.github/workflows/e4-bounded-output-runtime.yml'
      - 'scripts/capture_bounded_output.py'
  workflow_dispatch:

permissions: {}

jobs:
  bounded-output-runtime:
    name: Verify output flood stops a real Docker container
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    env:
      TEST_IMAGE: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
      OUTPUT_LIMIT: "1048576"
    steps:
      - name: Checkout reviewed branch without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run controlled output flood and verify hard cap
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/runtime-probe-output.txt"
          cidfile="$RUNNER_TEMP/runtime-probe-container.id"
          rm -f "$output" "$cidfile"
          docker pull --quiet "$TEST_IMAGE"

          set +e
          timeout --signal=TERM --kill-after=3s 30s docker run --rm --cidfile "$cidfile" \
            --network none --read-only --tmpfs /tmp --user 65534:65534 \
            --cap-drop ALL --security-opt no-new-privileges \
            "$TEST_IMAGE" python -c 'import sys,time; block=b"X"*8192; f=sys.stdout.buffer; exec("while True:\n f.write(block)\n f.flush()\n time.sleep(0.002)")' \
            2>&1 | python scripts/capture_bounded_output.py "$output" --max-bytes "$OUTPUT_LIMIT" --container-id-file "$cidfile"
          statuses=("${PIPESTATUS[@]}")
          docker_status="${statuses[0]}"
          capture_status="${statuses[1]}"
          set -e

          bytes="$(wc -c < "$output")"
          echo "docker_exit=$docker_status"
          echo "capture_exit=$capture_status"
          echo "captured_bytes=$bytes"
          echo "limit_bytes=$OUTPUT_LIMIT"

          test "$capture_status" -eq 125
          test "$bytes" -eq "$OUTPUT_LIMIT"
          test -s "$cidfile"
          container_id="$(cat "$cidfile")"

          # --rm removes the container after docker kill is observed; allow a short bounded wait.
          for attempt in $(seq 1 20); do
            if ! docker inspect "$container_id" >/dev/null 2>&1; then
              echo "runtime_result=container_stopped_and_removed"
              exit 0
            fi
            sleep 0.25
          done

          echo "::error::Container still exists after bounded-output handler requested docker kill."
          docker inspect "$container_id" || true
          exit 1
